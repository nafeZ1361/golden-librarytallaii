name: Phase 6 and Stage 7 ML validation

on:
  workflow_dispatch:
  push:
    branches: [main, "stage-7.1-ml-replay"]

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML test dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy==2.2.6 pandas==2.3.3 scikit-learn==1.5.2
      - name: Run Phase 6 and Stage 7 unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
